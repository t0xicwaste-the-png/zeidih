<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inventory overflow</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #f7f5ef;
            color: #111;
            font-family: "Courier New", monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        main {
            max-width: 520px;
            line-height: 1.6;
        }

        .faint {
            opacity: 0.22;
            font-size: 12px;
            margin-top: 36px;
        }
    </style>
</head>
<body>
<!-- mirrors do not like being linked directly -->
<main id="room">
    <p>wrong room.</p>
</main>

<script>
const room = document.getElementById("room");
const state = JSON.parse(localStorage.getItem("zeidih-secrets") || "{}");
const allowed = state.pass === "warehouse" || window.location.search.includes("knock=2");

if (allowed) {
    state.warehouseSeen = true;
    localStorage.setItem("zeidih-secrets", JSON.stringify(state));
    room.innerHTML = `
        <p>inventory overflow</p>
        <p>we tried to store the idea here and it kept changing shape.</p>
        <p>whoever finds this room is already part of the problem.</p>
        <p class="faint">if something starts copying you back, try mirror.html</p>
    `;
} else {
    room.innerHTML = `
        <p>wrong room.</p>
        <p class="faint">doors remember who opened them.</p>
    `;
}
</script>
</body>
</html>
